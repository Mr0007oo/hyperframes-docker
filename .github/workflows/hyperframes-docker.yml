name: Build and Push Multi-Arch HyperFrames Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: heygen-com/hyperframes

jobs:
  build-per-arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout official upstream HyperFrames
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase repo name
        id: repo_prep
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "full_image=${{ env.REGISTRY }}/${LOWER_REPO}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.test
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.repo_prep.outputs.full_image }}:build-${{ matrix.arch_tag }}
          provenance: false

  merge-manifests:
    needs: build-per-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout official upstream HyperFrames for version check
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: Prepare lowercase repo name and read version
        id: meta_prep
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          APP_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "full_image=${{ env.REGISTRY }}/${LOWER_REPO}" >> $GITHUB_OUTPUT
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          IMAGE="${{ steps.meta_prep.outputs.full_image }}"
          VERSION="${{ steps.meta_prep.outputs.version }}"
          SHA="${{ steps.meta_prep.outputs.sha }}"

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:sha-${SHA}" \
            "${IMAGE}:build-amd64" \
            "${IMAGE}:build-arm64"

      - name: Print build status and image URLs
        run: |
          echo "No source code changes made. Multi-arch image built directly from upstream ${{ env.UPSTREAM_REPO }}."
          echo "Latest image URL: ${{ steps.meta_prep.outputs.full_image }}:latest"
          echo "Versioned image URL: ${{ steps.meta_prep.outputs.full_image }}:${{ steps.meta_prep.outputs.version }}"
          echo "SHA image URL: ${{ steps.meta_prep.outputs.full_image }}:sha-${{ steps.meta_prep.outputs.sha }}"
