name: Build and Push Multi-Arch openshorts Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily build check at midnight UTC
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: mutonby/openshorts
  IMAGE_NAME: mr0007oo/openshorts

jobs:
  build-per-arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream openshorts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ matrix.arch_tag }}
          provenance: false

  merge-manifests:
    needs: build-per-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream openshorts for version metadata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: Extract metadata and version
        id: meta_prep
        run: |
          if [ -f package.json ]; then
            APP_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "latest")
          else
            APP_VERSION="latest"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ steps.meta_prep.outputs.version }}"
          SHA="${{ steps.meta_prep.outputs.sha }}"

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:sha-${SHA}" \
            "${IMAGE}:build-amd64" \
            "${IMAGE}:build-arm64"

      - name: Print build status and image URLs
        run: |
          echo "Successfully built and merged multi-arch image from ${{ env.UPSTREAM_REPO }}!"
          echo "Image Name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Latest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Version: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta_prep.outputs.version }}"
          echo "SHA Tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta_prep.outputs.sha }}"
